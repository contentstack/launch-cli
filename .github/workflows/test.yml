name: test
on:
  pull_request:
    branches: [feature/development-v2]
  push:
    branches: [feature/development-v2]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
