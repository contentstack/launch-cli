name: test
on:
  pull_request:
    branches: [v2-dev, v2-staging, v2-beta]
  push:
    branches: [v2-dev, v2-staging, v2-beta]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
